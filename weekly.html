function badge(v,k){
 if(v==null)return'nd';const t=KPI[k];if(!t)return'';

}
const ND='<span class="nd">&mdash;</span>';
function num(v,kind){
 if(v==null)return null;
 if(kind==='money2')return'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
 if(kind==='money0')return'$'+Math.round(v).toLocaleString('en-US');
 if(kind==='pct')return v.toFixed(1)+'%';

}
function cell(v,c){

function renderTable(){

}
function removeCondition(i){__cfConditions.splice(i,1); __cfRender(); if(window.__cfOrigRender) window.__cfOrigRender();}
function updateCondition(i,field,value){
  if(field==='val') value = (value===''?null:parseFloat(value));
  __cfConditions[i][field]=value;
  __cfUpdateCount();
  if(window.__cfOrigRender) window.__cfOrigRender();
}
function toggleCustomFilter(){var w=document.getElementById('cf-wrap'); if(w) w.classList.toggle('collapsed');}
function __cfUpdateCount(){
  var active=__cfConditions.filter(function(c){return c.metric&&c.val!=null;}).length;
  var b=document.getElementById('cf-count');
  if(!b) return;
  if(active>0){b.textContent=active; b.style.display='inline-block';}
  else{b.style.display='none';}
}
function __cfRender(){
  var cols=__cfGetMetrics();
  var host=document.getElementById('cf-rows');
  if(!host) return;
  if(!__cfConditions.length){host.innerHTML='<div class="cf-empty">No conditions \u2014 click \u201C+ Add condition\u201D to filter by any metric.</div>'; __cfUpdateCount(); return;}
  var html='';
  __cfConditions.forEach(function(c,i){
    html+='<div class="cf-row">';
    if(i===0){html+='<span class="cf-connector" style="background:transparent;border:none;color:#475569;cursor:default;text-align:right">WHERE</span>';}
    else{
      html+='<select class="cf-connector" onchange="updateCondition('+i+',\'connector\',this.value)">';
      html+='<option value="AND"'+(c.connector==='AND'?' selected':'')+'>AND</option>';
      html+='<option value="OR"'+(c.connector==='OR'?' selected':'')+'>OR</option>';
      html+='</select>';
    }
    html+='<select class="cf-select" onchange="updateCondition('+i+',\'metric\',this.value)">';
    html+='<option value="">Metric...</option>';
    cols.forEach(function(col){html+='<option value="'+col.key+'"'+(c.metric===col.key?' selected':'')+'>'+col.label+'</option>';});
    html+='</select>';
    html+='<select class="cf-select cf-op" onchange="updateCondition('+i+',\'op\',this.value)">';
    html+='<option value="gte"'+(c.op==='gte'?' selected':'')+'>\u2265</option>';
    html+='<option value="gt"'+(c.op==='gt'?' selected':'')+'>></option>';
    html+='<option value="lte"'+(c.op==='lte'?' selected':'')+'>\u2264</option>';
    html+='<option value="lt"'+(c.op==='lt'?' selected':'')+'><</option>';
    html+='</select>';
    html+='<input type="number" step="any" class="cf-input" placeholder="value" value="'+(c.val==null?'':c.val)+'" oninput="updateCondition('+i+',\'val\',this.value)">';
    html+='<button class="cf-remove" onclick="removeCondition('+i+')" title="Remove">\u2715</button>';
    html+='</div>';
  });
  host.innerHTML=html;
  __cfUpdateCount();
}
function __cfEval(r){
  if(!__cfConditions.length) return true;
  var active=__cfConditions.filter(function(c){return c.metric&&c.val!=null;});
  if(!active.length) return true;
  var result=null;
  for(var i=0;i<active.length;i++){
    var c=active[i]; var v=r[c.metric]; var ok;
    if(v==null) ok=false;
    else if(c.op==='gte') ok=v>=c.val;
    else if(c.op==='gt')  ok=v>c.val;
    else if(c.op==='lte') ok=v<=c.val;
    else if(c.op==='lt')  ok=v<c.val;
    else ok=false;
    if(result===null) result=ok;
    else if(c.connector==='OR') result=result||ok;
    else result=result&&ok;
  }
  return result===null?true:result;
}

window.__cfOrigRender = (typeof renderTable === 'function') ? renderTable
                       : ((typeof render === 'function') ? render : null);
(function(){
  if(typeof switchTab === 'function'){
    var __cfOrigSwitch = switchTab;
    switchTab = function(){var r = __cfOrigSwitch.apply(this, arguments); __cfRender(); return r;};
  }
  __cfRender();
})();
</script>

<style id="cv-style">

.cv-st.w{background:rgba(52,211,153,.14);color:#34D399}
.cv-st.l{background:rgba(248,113,113,.12);color:#F87171}

 .cv-bar{margin-left:0;width:100%}
 body.cv-cards .tab-bar{overflow-x:auto;max-width:100%;flex-wrap:nowrap}
 #cv-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .cv-body{padding:9px 10px 10px}
 .cv-mx b{font-size:11px}
 .cv-mx{gap:2px}
}
</style>
<script id="cv-script">
(function(){
var C={"tbody":"tbody","rerender":"renderTable","kpis":[["cpBooked","$/Booked","$"],["roas","ROAS","x"]],"asOf":"Oct 23","source":"spent yesterday","store":"cv-brv"};
var STEP=60;
function get(k,d){try{return localStorage.getItem(C.store+'-'+k)||d;}catch(e){return d;}}
function put(k,v){try{localStorage.setItem(C.store+'-'+k,v);}catch(e){}}
var mode=get('view','list'),status=get('status','all'),limit=STEP;
// Called by the page's renderer on its filtered rows, just before its in-place sort.
window.__cvFilter=function(rows){
 if(status==='active')rows=rows.filter(function(r){return r.cvLive===1;});
 else if(status==='paused')rows=rows.filter(function(r){return r.cvLive===0;});
 window.__cvRows=rows;return rows;
};
var tbody=document.getElementById(C.tbody);if(!tbody)return;
var wrap=tbody.closest('.table-wrap,.tbl-wrap')||tbody.closest('table');
wrap.classList.add('cv-hide-in-cards');
var grid=document.createElement('div');grid.id='cv-grid';
var more=document.createElement('button');more.id='cv-more';more.type='button';
wrap.parentNode.insertBefore(more,wrap.nextSibling);wrap.parentNode.insertBefore(grid,more);
more.onclick=function(){limit+=STEP;cards();};

var src=C.source==='spent yesterday'?'spent yesterday':'live in Meta';
var bar=document.createElement('div');bar.className='cv-bar';
bar.innerHTML='<div class="cv-seg" id="cv-status" title="Active = '+src+' (any of the creative’s ads), as of '+C.asOf+'"><span class="cv-lbl">Status</span>'+
 '<button type="button" data-v="all">All</button><button type="button" data-v="active"><span class="cv-dot on"></span>Active</button>'+
 '<button type="button" data-v="paused"><span class="cv-dot"></span>Paused</button></div>'+
 '<div class="cv-seg" id="cv-view"><button type="button" data-v="list">List</button><button type="button" data-v="cards">Cards</button></div>'+
 '<span class="cv-asof">Active = '+src+', '+C.asOf+'</span>';
var ctr=document.querySelector('.controls');
if(ctr)ctr.appendChild(bar);else wrap.parentNode.insertBefore(bar,wrap);
function seg(id,val,fn){var el=document.getElementById(id);
 [].forEach.call(el.querySelectorAll('button'),function(b){b.classList.toggle('on',b.getAttribute('data-v')===val);
  b.onclick=function(){fn(b.getAttribute('data-v'));};});}
function redraw(){var f=window[C.rerender];if(typeof f==='function')f();}
function setStatus(v){status=v;put('status',v);limit=STEP;seg('cv-status',v,setStatus);redraw();}
function setMode(v){mode=v;put('view',v);seg('cv-view',v,setMode);document.body.classList.toggle('cv-cards',v==='cards');limit=STEP;cards();}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function money(v){if(v==null||isNaN(v))return '—';var a=Math.abs(v);
 if(a>=1e6)return '$'+(v/1e6).toFixed(2)+'M';if(a>=1e5)return '$'+Math.round(v/1e3)+'k';if(a>=1e4)return '$'+(v/1e3).toFixed(1)+'k';
 return '$'+(a>=100?Math.round(v).toLocaleString('en-US'):v.toFixed(2));}
function val(v,f){if(v==null||v===''||isNaN(v))return '—';return f==='x'?(+v).toFixed(2)+'x':money(+v);}
function stCls(s){s=(s||'').toLowerCase();return s.indexOf('past winner')>=0?'p':s.indexOf('winner')>=0?'w':s.indexOf('loser')>=0?'l':
 s.indexOf('fence')>=0?'f':s.indexOf('testing')>=0?'t':'';}
function card(r){
 var id=r.cvThumb,kind=r.cvKind||'static',live=r.cvLive;
 var media=(id&&kind!=='copy')?'<img loading="lazy" decoding="async" alt=""'+(kind==='video'?'':' class="fit"')+' src="thumbs/'+id+'.jpg" onerror="this.outerHTML=\'<div class=cv-ph><b>'+kind+'</b></div>\'">':
  '<div class="cv-ph"><b>'+(kind==='copy'?'Copy':kind==='video'?'Video':'Static')+'</b>'+(kind==='copy'?esc(r.name):'<span style="color:#64748B">No still saved yet \u2014 open the ad to view it</span>')+'</div>';
 var lv=live===1?'<span class="cv-live on"><span class="cv-dot on"></span>Active</span>':live===0?'<span class="cv-live"><span class="cv-dot"></span>Paused</span>':'';
 var st=r.status||r.winnerStatus;
 var tags=(st?'<span class="cv-st '+stCls(st)+'">'+esc(st)+'</span>':'')+(r.style?'<span class="cv-st">'+esc(r.style)+'</span>':'');
 var mx='<div><b>'+money(r.cost)+'</b><span>Spend</span></div>';
 C.kpis.forEach(function(k){mx+='<div><b>'+val(r[k[0]],k[2])+'</b><span>'+k[1]+'</span></div>';});
 var tag=r.link?'a':'div',href=r.link?' href="'+esc(r.link)+'" target="_blank" rel="noopener"':'';
 return '<'+tag+' class="cv-card"'+href+' title="'+esc(r.name)+'"><div class="cv-media">'+media+lv+(kind==='video'?'<span class="cv-play"></span>':'')+'</div>'+
  '<div class="cv-body"><div class="cv-name">'+esc(r.name)+'</div><div class="cv-tags">'+tags+'</div><div class="cv-mx">'+mx+'</div></div></'+tag+'>';
}
function cards(){
 if(mode!=='cards'){grid.innerHTML='';more.classList.remove('has');return;}
 var rows=window.__cvRows||[],n=Math.min(limit,rows.length),h='';
 for(var i=0;i<n;i++)h+=card(rows[i]);
 grid.innerHTML=h||'<div id="cv-empty" style="display:block">No creatives match these filters.</div>';
 more.textContent='Show more ('+(rows.length-n)+' left)';more.classList.toggle('has',rows.length>n);
}
// Dot in front of each table row's name; rows line up 1:1 with the renderer's sorted array.
function dots(){
 var rows=window.__cvRows||[],trs=tbody.children;if(trs.length!==rows.length)return;
 for(var i=0;i<trs.length;i++){var r=rows[i];if(r.cvLive==null)continue;
  var td=trs[i].querySelector('td[title]');if(!td||td.querySelector('.cv-dot'))continue;
  var d=document.createElement('span');d.className='cv-dot'+(r.cvLive===1?' on':'');d.title=r.cvLive===1?'Active':'Paused';
  td.insertBefore(d,td.firstChild);}
}
new MutationObserver(function(){dots();cards();}).observe(tbody,{childList:true});
seg('cv-status',status,setStatus);seg('cv-view',mode,setMode);
document.body.classList.toggle('cv-cards',mode==='cards');
redraw();
})();
</script>
