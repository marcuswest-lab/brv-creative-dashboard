  if(c.sortable)th+='<th class="'+cls+'" onclick="doSort(\''+c.key+'\')">'+c.label+'<span class="arr">'+arr+'</span></th>';
  else th+='<th class="'+cls+'">'+c.label+'</th>';
 });
 document.getElementById('thead').innerHTML=th+'</tr>';
 let tb='';
 filtered.forEach((r,i)=>{
  tb+='<tr>';
  cols.forEach(c=>{
   const cls=c.cls||'';
   if(c.key==='idx'){tb+='<td class="'+cls+'">'+(i+1)+'</td>';return;}
   if(c.key==='name'){tb+='<td class="'+cls+'" title="'+(r.name||'').replace(/"/g,'&quot;')+'">'+(r.name||'')+'</td>';return;}
   if(c.key==='style'){tb+='<td class="'+cls+'">'+(r.style||ND)+'</td>';return;}
   if(c.key==='link'){tb+='<td>'+fmtLink(r.link)+'</td>';return;}
   tb+='<td>'+cell(r[c.key],c)+'</td>';
  });
  tb+='</tr>';
 });
 document.getElementById('tbody').innerHTML=tb;
 document.getElementById('rowCount').textContent=filtered.length+' of '+data.length+(t.isConcept?' concepts':' creatives');
}
function switchTab(i){curTab=i;sortCol='cost';sortAsc=false;buildTabs();buildLegend();renderTable();}
function doSort(col){if(sortCol===col)sortAsc=!sortAsc;else{sortCol=col;sortAsc=(col==='name');}renderTable();}
function toggleFilter(f){filters[f]=!filters[f];document.getElementById(f==='winners'?'btnWinners':'btnSpend').classList.toggle('active');renderTable();}
document.getElementById('search').addEventListener('input',renderTable);
buildTabs();buildLegend();renderTable();

// ===== Custom filters (AND/OR) =====
var __cfConditions = [];
function __cfGetMetrics(){
  try{
    var cols = getCols();
    // A filterable metric = any keyed column that isn't the name/index column
    // and isn't explicitly non-sortable. Handles both column shapes: dashboards
    // that tag cols with sortable:true/false (TCC/CEO/DH/Quintessa) and those
    // that omit the flag entirely (Case Source uses {key,label,fmt}).
    return cols.filter(function(c){
      return c && c.key && c.key!=='name' && c.key!=='idx' && c.sortable!==false;
    });
  }catch(e){return [];}
}
function addCondition(){
  __cfConditions.push({metric:'',op:'gte',val:null,connector:'AND'});
  var w=document.getElementById('cf-wrap'); if(w) w.classList.remove('collapsed');
  __cfRender();
}
function removeCondition(i){__cfConditions.splice(i,1); __cfRender(); if(window.__cfOrigRender) window.__cfOrigRender();}
function updateCondition(i,field,value){
  if(field==='val') value = (value===''?null:parseFloat(value));
  __cfConditions[i][field]=value;
  __cfUpdateCount();
  if(window.__cfOrigRender) window.__cfOrigRender();
}
function toggleCustomFilter(){var w=document.getElementById('cf-wrap'); if(w) w.classList.toggle('collapsed');}
function __cfUpdateCount(){
  var active=__cfConditions.filter(function(c){return c.metric&&c.val!=null;}).length;
  var b=document.getElementById('cf-count');
  if(!b) return;
  if(active>0){b.textContent=active; b.style.display='inline-block';}
  else{b.style.display='none';}
}
function __cfRender(){
  var cols=__cfGetMetrics();
  var host=document.getElementById('cf-rows');
  if(!host) return;
  if(!__cfConditions.length){host.innerHTML='<div class="cf-empty">No conditions \u2014 click \u201C+ Add condition\u201D to filter by any metric.</div>'; __cfUpdateCount(); return;}
  var html='';
  __cfConditions.forEach(function(c,i){
    html+='<div class="cf-row">';
    if(i===0){html+='<span class="cf-connector" style="background:transparent;border:none;color:#475569;cursor:default;text-align:right">WHERE</span>';}
    else{
      html+='<select class="cf-connector" onchange="updateCondition('+i+',\'connector\',this.value)">';
      html+='<option value="AND"'+(c.connector==='AND'?' selected':'')+'>AND</option>';
      html+='<option value="OR"'+(c.connector==='OR'?' selected':'')+'>OR</option>';
      html+='</select>';
    }
    html+='<select class="cf-select" onchange="updateCondition('+i+',\'metric\',this.value)">';
    html+='<option value="">Metric...</option>';
    cols.forEach(function(col){html+='<option value="'+col.key+'"'+(c.metric===col.key?' selected':'')+'>'+col.label+'</option>';});
    html+='</select>';
    html+='<select class="cf-select cf-op" onchange="updateCondition('+i+',\'op\',this.value)">';
    html+='<option value="gte"'+(c.op==='gte'?' selected':'')+'>\u2265</option>';
    html+='<option value="gt"'+(c.op==='gt'?' selected':'')+'>></option>';
    html+='<option value="lte"'+(c.op==='lte'?' selected':'')+'>\u2264</option>';
    html+='<option value="lt"'+(c.op==='lt'?' selected':'')+'><</option>';
    html+='</select>';
    html+='<input type="number" step="any" class="cf-input" placeholder="value" value="'+(c.val==null?'':c.val)+'" oninput="updateCondition('+i+',\'val\',this.value)">';
    html+='<button class="cf-remove" onclick="removeCondition('+i+')" title="Remove">\u2715</button>';
    html+='</div>';
  });
  host.innerHTML=html;
  __cfUpdateCount();
}
function __cfEval(r){
  if(!__cfConditions.length) return true;
  var active=__cfConditions.filter(function(c){return c.metric&&c.val!=null;});
  if(!active.length) return true;
  var result=null;
  for(var i=0;i<active.length;i++){
    var c=active[i]; var v=r[c.metric]; var ok;
    if(v==null) ok=false;
    else if(c.op==='gte') ok=v>=c.val;
    else if(c.op==='gt')  ok=v>c.val;
    else if(c.op==='lte') ok=v<=c.val;
    else if(c.op==='lt')  ok=v<c.val;
    else ok=false;
    if(result===null) result=ok;
    else if(c.connector==='OR') result=result||ok;
    else result=result&&ok;
  }
  return result===null?true:result;
}

window.__cfOrigRender = (typeof renderTable === 'function') ? renderTable
                       : ((typeof render === 'function') ? render : null);
(function(){
  if(typeof switchTab === 'function'){
    var __cfOrigSwitch = switchTab;
    switchTab = function(){var r = __cfOrigSwitch.apply(this, arguments); __cfRender(); return r;};
  }
  __cfRender();
})();
</script>
